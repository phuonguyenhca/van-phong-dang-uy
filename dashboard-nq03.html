const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])),fmt=n=>String(n).replace(".",",");
const today=new Date(),late=t=>t[5]!="ok"&&new Date(t[3])<today,cnt=k=>T.filter(t=>t[5]==k).length,chip=k=>`<span class="chip ${k}">${S[k]}</span>`;
const ST=["ok","mid","warn","todo"];
const R=document.documentElement;
function setTh(m){R.dataset.theme=m;try{localStorage.setItem("th",m)}catch(e){}$("#th").textContent=m=="dark"?"Chế độ sáng":"Chế độ tối"}
let th=null;try{th=localStorage.getItem("th")}catch(e){}
setTh(th||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
$("#th").onclick=()=>setTh(R.dataset.theme=="dark"?"light":"dark");$("#pr").onclick=()=>print();
const prog=t=>t[7]?`<div class="pg ${t[5]}"><i style="width:${Math.min(100,t[7]/t[8]*100)}%"></i></div><div class="s">${fmt(t[7])}% so với chỉ tiêu ${t[8]}%</div>`:"";
const VW={
a(){const dl=Math.ceil((new Date("2026-11-30")-today)/864e5),n=T.filter(t=>t[3]=="2026-11-30").length;
return `<div class="kpis">${ST.map(k=>`<div class="kpi ${k}"><div class="n">${cnt(k)}</div><div class="l">${S[k]}</div></div>`).join("")}<div class="kpi"><div class="n">${n}</div><div class="l">đến hạn 30/11/2026${dl>=0?`, còn ${dl} ngày`:""}</div></div></div>
<h2>Tiến độ 21 chỉ tiêu năm 2026</h2><div class="card"><div class="dist">${ST.map(k=>`<i class="${k}" style="flex:${cnt(k)||0.001}"></i>`).join("")}</div><div class="lg">${ST.map(k=>`<span class="${k}"><b></b><span style="color:var(--mut)">${S[k]}: ${cnt(k)}</span></span>`).join("")}</div>
<p class="s" style="margin:12px 0 0;font-size:13px;color:var(--mut)">Báo cáo 9 tháng nêu 14/21 chỉ tiêu đạt và vượt nhưng chưa liệt kê từng chỉ tiêu. Biểu đồ chỉ tính những chỉ tiêu đã có số liệu đối chiếu.</p></div>
<h2>Số liệu nổi bật theo Báo cáo 9 tháng</h2><div class="facts">${[["87","cuộc họp trên iCPV Cabinet, 100% thành phần tham gia"],["96,28%","đảng viên dùng Sổ tay điện tử"],["100%","cán bộ, công chức, viên chức học Bình dân học vụ số"],["98,31%","hồ sơ TTHC xử lý đúng hạn (5.705/5.803)"],["100%","doanh nghiệp nhỏ và vừa ứng dụng công nghệ số (1.581)"],["1.743.349","lượt xem fanpage, 1.885 tin, bài"]].map(x=>`<div class="card"><div class="n">${x[0]}</div><div class="l">${x[1]}</div></div>`).join("")}</div>`},
b(){return `<div class="tool"><input id="q" placeholder="Tìm chỉ tiêu, cơ quan, kết quả…" aria-label="Tìm kiếm"><select id="fo" aria-label="Cơ quan chủ trì"><option value="">Mọi cơ quan chủ trì</option>${[...new Set(T.map(t=>t[2]))].map(o=>`<option>${esc(o)}</option>`).join("")}</select><select id="fs" aria-label="Trạng thái"><option value="">Mọi trạng thái</option>${ST.map(k=>`<option value="${k}">${S[k]}</option>`).join("")}</select><select id="fd" aria-label="Thời hạn"><option value="">Mọi thời hạn</option>${[...new Set(T.map(t=>t[4]))].map(o=>`<option>${esc(o)}</option>`).join("")}</select><button class="btn" id="rs">Xóa bộ lọc</button><span class="cn" id="cn"></span></div>

c(){return `<div class="tw"><table><thead><tr><th>Mục tiêu đến năm 2030</th><th>Chủ trì</th><th>Mốc tiến độ</th></tr></thead><tbody>${L.map(l=>`<tr><td><b>${l[0]}.</b> ${esc(l[1])}</td><td data-l="Chủ trì">${esc(l[2])}</td><td><div class="ms">${l[3].map(m=>`<span>${esc(m)}</span>`).join("")}</div></td></tr>`).join("")}</tbody></table></div>`},
d(){const sc=t=>t[5]=="warn"?0:late(t)&&t[5]=="todo"?1:late(t)?2:t[5]=="todo"?3:4,ls=T.filter(t=>t[5]=="warn"||t[5]=="todo"||late(t)||t[9]).sort((a,b)=>sc(a)-sc(b)||a[0]-b[0]);

return `<p class="s" style="color:var(--mut);font-size:13.5px;margin:0 0 12px">${ls.length} chỉ tiêu cần theo dõi, xếp theo mức ưu tiên: dưới chỉ tiêu, quá mốc, chưa có số liệu.</p>`+ls.map(t=>`<div class="card todo-card ${t[5]}"><h3>${t[0]}. ${esc(t[1])}</h3><div class="s">${chip(t[5])}${late(t)?'<span class="late">Quá mốc '+t[4]+'</span>':" Hạn: "+t[4]}. Chủ trì: ${esc(t[2])}</div>${t[9]?`<div class="nt" style="color:var(--warn);font-size:13px;margin-top:6px">${esc(t[9])}</div>`:""}${ac(t)?`<div class="ac">${esc(ac(t))}</div>`:""}</div>`).join("")}};
const TT={a:"Tổng quan",b:"Chỉ tiêu năm 2026 (21)",c:"Lộ trình đến năm 2030 (14 mục tiêu)",d:"Cần xử lý"};
function drawRows(){const q=$("#q").value.toLowerCase(),o=$("#fo").value,s=$("#fs").value,d=$("#fd").value;

$("#cn").textContent=`Hiển thị ${r.length}/21 chỉ tiêu`}
function go(v){$("#v").innerHTML=VW[v]();$("#ttl").textContent=TT[v];document.querySelectorAll("#nav button").forEach(b=>b.toggleAttribute("aria-current",b.dataset.v==v)||b.removeAttribute("aria-current"));
document.querySelectorAll("#nav button").forEach(b=>{if(b.dataset.v==v)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
if(v=="b"){["#q","#fo","#fs","#fd"].forEach(i=>$(i).oninput=drawRows);$("#rs").onclick=()=>{["#q","#fo","#fs","#fd"].forEach(i=>$(i).value="");drawRows()};drawRows()}scrollTo(0,0)}
$("#nav").onclick=e=>{if(e.target.dataset.v)go(e.target.dataset.v)};go("a");
